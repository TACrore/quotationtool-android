name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config zlib1g-dev \
            libncurses-dev libtinfo5 cmake \
            libffi-dev libssl-dev
          python3 -m pip install --upgrade "pip<24.1"
          python3 -m pip install buildozer cython

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Force python3 -> 3.11 for p4a venv
        run: |
          sudo ln -sf "$(command -v python3)" /usr/local/bin/python3
          which -a python3
          python3 -V

      - name: Pre-clone p4a and mirror openssl source
        run: |
          git clone --depth 1 https://github.com/kivy/python-for-android "$HOME/p4a"
          sed -i "s#https://www.openssl.org/source/#https://mirrors.huaweicloud.com/openssl/source/#" \
            "$HOME/p4a/pythonforandroid/recipes/openssl/__init__.py"
          grep -rl "https://github.com/" "$HOME/p4a/pythonforandroid/recipes" | while read -r f; do
            sed -i 's#https://github.com/\([^/]*/[^/]*\)/releases/download/#https://mirrors.huaweicloud.com/github-release/\1/releases/download/#g' "$f"
          done
          grep -rn "mirrors.huaweicloud.com/github-release" "$HOME/p4a/pythonforandroid/recipes" | head -8
      - name: Build debug APK
        run: |
          export PATH=$PATH:~/.local/bin
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quotationtool-apk
          path: bin/*.apk
          if-no-files-found: error





